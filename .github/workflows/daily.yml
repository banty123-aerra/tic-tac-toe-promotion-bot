
name: Daily Game Promotion

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

jobs:
  generate-post:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate daily promotion
        run: python bot.py

      - name: Show promotion post
        run: |
          cat daily_post.txt >> "$GITHUB_STEP_SUMMARY"
